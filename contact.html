<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Nicolas Vaca</title>
    <meta name="description" content="Get in touch with Nicolas Vaca — entrepreneur, podcast host of Untold, and writer based in Madrid. Drop a message or connect on social media.">
  <link rel="stylesheet" href="shared.css">
  <style>
    body { background: #fff; color: #1a1a1a; }

    /* ─── HERO ─── */
    #contact-hero {
      padding: 120px 8% 80px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }
    #contact-hero-label {
      font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
      color: rgba(0,0,0,0.35); font-family: 'Fragment Mono', monospace;
      margin-bottom: 16px;
    }
    #contact-hero-title {
      font-size: clamp(42px, 7vw, 96px); font-weight: 900;
      letter-spacing: -0.03em; line-height: 0.92; color: #000;
      max-width: 700px;
    }

    /* ─── SHARED ─── */
    .section-label {
      font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
      color: rgba(0,0,0,0.35); font-family: 'Fragment Mono', monospace; margin-bottom: 4px;
    }
    .section-title { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; color: #000; }
    .body-text { font-size: 17px; line-height: 1.8; color: rgba(0,0,0,0.5); }
    .body-text-dark { font-size: 17px; line-height: 1.8; color: rgba(255,255,255,0.5); }

    /* ─── QUOTE ROTATOR ─── */
    #quote-section {
      background: #000; color: #fff;
      padding: 80px 8%;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    #quote-inner { display: grid; grid-template-columns: 1fr 2fr; gap: 80px; align-items: start; }
    #quote-left { display: flex; flex-direction: column; gap: 24px; }
    #quote-left .section-label { color: rgba(255,255,255,0.35); }
    #quote-left .section-title { color: #fff; }
    #quote-nav { display: flex; gap: 10px; align-items: center; }
    .q-arrow {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.2); background: transparent;
      color: rgba(255,255,255,0.6); font-size: 15px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: border-color 180ms, color 180ms;
    }
    .q-arrow:hover { border-color: rgba(255,255,255,0.7); color: #fff; }
    #quote-right { position: relative; height: 280px; overflow: hidden; }
    #quote-display {
      display: flex; flex-direction: column; gap: 20px;
      animation: quoteFadeIn 400ms ease;
      position: absolute; inset: 0; overflow: hidden;
    }
    @keyframes quoteFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    #quote-text {
      font-size: clamp(16px, 2vw, 24px); font-weight: 600;
      line-height: 1.55; letter-spacing: -0.02em; color: #fff;
      font-style: italic;
    }
    #quote-text::before { content: '\201C'; }
    #quote-text::after  { content: '\201D'; }
    #quote-author {
      font-size: 13px; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; color: rgba(255,255,255,0.4);
      font-family: 'Fragment Mono', monospace; flex-shrink: 0;
    }
    #quote-dots { display: flex; gap: 6px; margin-top: 4px; }
    .q-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: rgba(255,255,255,0.2); cursor: pointer;
      transition: background 200ms, transform 200ms; border: none;
    }
    .q-dot.active { background: #fff; transform: scale(1.3); }

    /* ─── CONTACT GRID ─── */
    #contact-main { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid rgba(0,0,0,0.08); }
    #contact-left {
      padding: 60px 8%; border-right: 1px solid rgba(0,0,0,0.08);
      display: flex; flex-direction: column; gap: 32px;
    }
    #contact-right { padding: 60px 8%; display: flex; flex-direction: column; gap: 14px; }

    /* Socials */
    #socials-block { display: flex; flex-direction: column; gap: 0; }
    .social-row {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 0; border-bottom: 1px solid rgba(0,0,0,0.07);
      text-decoration: none; color: #000;
      transition: opacity 180ms; cursor: pointer;
    }
    .social-row:hover { opacity: 0.5; }
    .social-icon {
      width: 34px; height: 34px; border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.15);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: #1a1a1a;
    }
    .social-icon svg { width: 15px; height: 15px; }
    .social-info { display: flex; flex-direction: column; gap: 1px; flex: 1; }
    .social-name { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
    .social-handle { font-size: 11px; color: rgba(0,0,0,0.35); font-family: 'Fragment Mono', monospace; }
    .social-arrow { font-size: 14px; color: rgba(0,0,0,0.3); }

    /* Form */
    .g-field { display: flex; flex-direction: column; gap: 6px; }
    .g-label { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(0,0,0,0.38); }
    .g-input, .g-textarea {
      background: #fff; border: 1px solid rgba(0,0,0,0.12);
      border-radius: 3px; color: #1a1a1a;
      font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px;
      padding: 11px 14px; outline: none; transition: border-color 180ms;
      width: 100%; box-sizing: border-box;
    }
    .g-input::placeholder, .g-textarea::placeholder { color: rgba(0,0,0,0.25); }
    .g-input:focus, .g-textarea:focus { border-color: rgba(0,0,0,0.5); }
    .g-textarea { resize: vertical; min-height: 110px; }
    .g-submit {
      margin-top: 6px; height: 44px; padding: 0 24px;
      background: #000; color: #fff; border-radius: 3px;
      font-size: 12px; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; font-family: 'Plus Jakarta Sans', sans-serif;
      cursor: pointer; border: none; align-self: flex-start; transition: opacity 180ms;
    }
    .g-submit:hover { opacity: 0.7; }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 900px) {
      #quote-inner { grid-template-columns: 1fr; gap: 40px; }
      #quote-right { height: auto; min-height: 200px; }
      #quote-display { position: relative; inset: auto; overflow: visible; }
      #contact-main { grid-template-columns: 1fr; }
      #contact-left { border-right: none; border-bottom: 1px solid rgba(0,0,0,0.08); padding: 48px 6%; }
      #contact-right { padding: 48px 6%; }
      #contact-hero { padding: 100px 6% 60px; }
    }
    @media (max-width: 600px) {
      #quote-section { padding: 60px 6%; }
    }
  </style>
</head>
<body>

  <!-- nav + footer injected by components.js -->

  <!-- ─── HERO ─── -->
  <section id="contact-hero">
    <div id="contact-hero-label">Get in touch</div>
    <div id="contact-hero-title">Let's talk.</div>
  </section>

  <!-- ─── QUOTE ROTATOR ─── -->
  <section id="quote-section">
    <div id="quote-inner">
      <div id="quote-left">
        <div>
          <div class="section-label">Words that stuck</div>
          <div class="section-title" style="color:#fff;">Quotes I return to</div>
        </div>

        <div id="quote-dots"></div>

      <div id="quote-right">
        <div id="quote-display">
          <div id="quote-text"></div>
          <div id="quote-author"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ─── CONTACT MAIN ─── -->
  <section id="contact-main">

    <!-- LEFT: socials -->
    <div id="contact-left">

      <div>
        <div class="section-label" style="margin-bottom:4px;">Elsewhere</div>
        <div id="socials-block">

          <a class="social-row" href="https://x.com/nicolasvacagr" target="_blank" rel="noopener">

            </div>
            <div class="social-info">
              <span class="social-name">Instagram</span>

          <a class="social-row" href="https://linkedin.com/in/nicovaca" target="_blank" rel="noopener">

          <a class="social-row" href="https://youtube.com/@nicolasvacagr" target="_blank" rel="noopener">

              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
            </div>

          <a class="social-row" href="https://open.spotify.com/show/5FGKcMKTWyOAPTgkGNxATB" target="_blank" rel="noopener">
            <div class="social-icon">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>

    <!-- RIGHT: form -->
    <div id="contact-right">
      <div>
        <div class="section-label">Message</div>
        <div class="section-title">Send it over</div>
      </div>
      <form id="contact-form" onsubmit="handleSubmit(event)" style="display:flex;flex-direction:column;gap:14px;margin-top:8px;">
        <div class="g-field">
          <label class="g-label" for="c-name">Your Name</label>

          <label class="g-label" for="c-email">Email</label>
          <input class="g-input" type="email" id="c-email" placeholder="you@example.com" required>
        </div>
        <div class="g-field">
          <label class="g-label" for="c-message">Message</label>
          <textarea class="g-textarea" id="c-message" placeholder="What's on your mind…" required></textarea>
        </div>
        <button class="g-submit" type="submit" id="c-btn">Send →</button>

  </section>

  <script>window.PAGE_LIGHT_SECTIONS = ['contact-hero', 'contact-main'];</script>
  <script>window.PAGE_DARK_SECTIONS = ['quote-section'];</script>
  <script src="components.js"></script>
  <script>
    const QUOTES = [
      {
        text: "You need to do at least a bit of what you care about now, as opposed to banking on finding time for it in the future, once the decks are clear and life's duties are out of the way. Life's duties will never be out of the way. And so if you really mean it when you say you'd like to write a novel or spend more of your time with your ageing parents or fighting climate change (or having fun), at some point you're just going to have to start doing it.",
        author: "Oliver Burkeman"
      },
      {
        text: "The loser has more in common with the winner than with the person sitting on the sidelines. The winner and the loser each had the courage to try. Both risked embarrassment. Both were willing to face uncertainty. Both were stubborn enough to continue. Success is endurance in disguise. It belongs to the person who can absorb the losses without absorbing the identity of 'loser.' The sidelines are safe, but sterile. Nothing grows there.",
        author: "James Clear"
      },
      {
        text: "Most people never pick up the phone and call. Most people never ask. And that's what sometimes separates the people who do things from the people who just dream about them. You gotta act. And you gotta be willing to fail, you gotta be ready to crash and burn. I've never found anyone who said no or hung up the phone when I called. I just asked.",
        author: "Steve Jobs"
      },
      {
        text: "You cannot stay on the summit forever; you have to come down again. So why bother in the first place? Just this: What is above knows what is below, but what is below does not know what is above. One climbs, one sees. One descends, one sees no longer, but one has seen. There is an art of conducting oneself in the lower regions by the memory of what one saw higher up. When one can no longer see, one can at least still know.",
        author: "René Daumal"
      },
      {
        text: "When you can, ask yourself if you want to before you do.",
        author: "Matthew McConaughey"
      },
      {
        text: "The master in the art of living draws no distinction between his work and his play. His labor and his leisure, his mind and his body, his education and his recreation, his love and his religion. He hardly knows which is which. He simply pursues his vision of excellence through whatever he is doing. And leaves it up to others to decide whether he is working or playing. To himself he's always doing both.",
        author: "Lawrence Pearsall Jacks"
      },
      {
        text: "If it is peace you want, seek to change yourself, not other people. It is easier to protect your feet with slippers than to carpet the whole of the earth.",
        author: "Anthony de Mello"
      },
      {
        text: "Everybody's journey starts embarrassingly small. Have a little compassion for yourself. Have the humility to accept that the first step is going to be so small it almost wouldn't register on the ledger of accomplishments.",
        author: "Chris Williamson"
      }
    ];

    let currentQuote = 0;

    function fitQuoteText() { const right = document.getElementById('quote-right'); const txt = document.getElementById('quote-text'); txt.style.fontSize = ''; let size = parseFloat(getComputedStyle(txt).fontSize); while (document.getElementById('quote-display').scrollHeight > right.clientHeight && size > 10) { size -= 0.5; txt.style.fontSize = size + 'px'; } } function renderQuote(index, animate = true) {
      const q = QUOTES[index];
      const display = document.getElementById('quote-display');
      if (animate) {
        display.style.animation = 'none';
        display.offsetHeight;
        display.style.animation = 'quoteFadeIn 400ms ease';
      }
      document.getElementById('quote-text').textContent = q.text;
      document.getElementById('quote-author').textContent = '— ' + q.author;
      document.querySelectorAll('.q-dot').forEach((d, i) => d.classList.toggle('active', i === index)); setTimeout(fitQuoteText, 0);
    }

    function buildDots() {
      const container = document.getElementById('quote-dots');
      QUOTES.forEach((_, i) => {
        const dot = document.createElement('button');
        dot.className = 'q-dot' + (i === 0 ? ' active' : '');
        dot.setAttribute('aria-label', 'Quote ' + (i + 1));
        dot.addEventListener('click', () => { currentQuote = i; renderQuote(i); });
        container.appendChild(dot);
      });
    }

    document.getElementById('q-next').addEventListener('click', () => {
      currentQuote = (currentQuote + 1) % QUOTES.length;
      renderQuote(currentQuote);
    });
    document.getElementById('q-prev').addEventListener('click', () => {
      currentQuote = (currentQuote - 1 + QUOTES.length) % QUOTES.length;
      renderQuote(currentQuote);
    });

    setInterval(() => {
      currentQuote = (currentQuote + 1) % QUOTES.length;
      renderQuote(currentQuote);
    }, 8000);

    buildDots();
    renderQuote(0, false);

    function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('c-btn');
      btn.textContent = 'Sending…'; btn.disabled = true;
      setTimeout(() => {
        btn.textContent = 'Sent ✓';
        setTimeout(() => { btn.textContent = 'Send →'; btn.disabled = false; }, 3000);
      }, 1200);
    }
  </script>
</body>
</html>
