<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Fragment+Mono&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nicolas Vaca</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; scroll-behavior: smooth; }
    body { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; background: #000; color: #fff; overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; background: none; border: none; font: inherit; color: inherit; }
    img { display: block; max-width: 100%; }

    /* ─── NAV ─── */
    #nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      padding: 22px 40px;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(0,0,0,0);
      transition: background 200ms ease;
    }
    /* Name: hidden at start, fades in once scrolled */
    #nav-name {
      font-size: 16px; font-weight: 800; letter-spacing: 0.02em; white-space: nowrap;
      opacity: 0; pointer-events: none;
      transition: opacity 300ms ease;
    }
    #nav-name.visible { opacity: 1; pointer-events: auto; }

    /* Links: start centered across full bar, slide to right on scroll */
    #nav-links {
      display: flex; gap: 48px; align-items: center;
      position: absolute; left: 0; right: 0;
      justify-content: center;
      transition: right 350ms ease, left 350ms ease;
    }
    #nav-links.scrolled {
      position: absolute; left: auto; right: 40px;
      justify-content: flex-end;
    }
    #nav-links a { font-size: 14px; letter-spacing: 0.15em; font-weight: 400; opacity: 0.88; transition: opacity 180ms ease; white-space: nowrap; }
    #nav-links a:hover { opacity: 1; }

    /* ─── HERO ─── */
    #hero { position: relative; height: 100vh; overflow: hidden; background: #111; z-index: 1; }
    #hero-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 20%; filter: grayscale(100%); background: linear-gradient(160deg, #1a1a1a 0%, #2d2d2d 40%, #1a1a1a 100%); }
    #hero::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.18); pointer-events: none; }
    #hero-nico {
      position: absolute;
      top: 64px; left: 40px; /* top = nav height, maintaining constant gap */
      font-size: clamp(80px, 14vw, 160px); font-weight: 900; letter-spacing: -0.02em; line-height: 1;
      color: #fff; z-index: 2; user-select: none; will-change: transform;
    }
    #hero-vaca { position: absolute; bottom: 18px; right: 40px; font-size: clamp(80px, 14vw, 160px); font-weight: 900; letter-spacing: -0.02em; line-height: 1; color: #fff; z-index: 2; user-select: none; }
    #hero-tagline { position: absolute; bottom: 36px; left: 40px; font-size: 24px; letter-spacing: 0.05em; font-weight: 400; color: rgba(255,255,255,0.75); line-height: 1.3; z-index: 2; font-family: 'Fragment Mono', monospace; text-transform: uppercase; }
    #hero-arrow { display: block; margin-top: 8px; font-size: 18px; animation: bounce 2s ease-in-out infinite; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }

    /* ─── ABOUT SCROLL ─── */
    #about-scroll-wrapper { position: relative; height: 400vh; background: #000; z-index: 2; }
    #about-scroll-sticky { position: sticky; top: 0; height: 100vh; display: flex; align-items: center; justify-content: flex-start; padding: 0 8%; overflow: hidden; }
    .about-sentence-block { max-width: 100%; }
    .about-sentence { display: inline; font-size: clamp(28px, 4.5vw, 60px); font-weight: 700; line-height: 1.22; letter-spacing: -0.02em; color: rgba(255,255,255,0.15); transition: color 500ms ease; }
    .about-sentence.lit { color: rgba(255,255,255,1); }
    .about-sentence.dim { color: rgba(255,255,255,0.15); }

    /* ─── ABOUT BIO ─── */
    #about { background: #000; display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; align-items: center; padding: 80px 8%; gap: 80px; }
    #about-photo { position: relative; aspect-ratio: 3/4; max-height: 600px; overflow: hidden; border-radius: 2px; background: #1a1a1a; }
    #about-photo img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); }
    #about-text-col { display: flex; flex-direction: column; gap: 32px; }
    .about-para { font-size: clamp(16px, 1.6vw, 20px); line-height: 1.7; color: rgba(255,255,255,0.38); font-weight: 400; }
    .about-para .hi { color: #fff; font-weight: 700; }
    #about-meta { display: flex; flex-direction: column; gap: 4px; }
    #about-location { font-size: 15px; color: rgba(255,255,255,0.5); font-weight: 400; }
    #about-clock { font-size: 18px; font-weight: 600; color: rgba(255,255,255,0.85); letter-spacing: -0.01em; }
    #about-clock span { font-size: 14px; font-weight: 400; color: rgba(255,255,255,0.4); margin-left: 4px; }
    #about-divider { width: 100%; height: 1px; background: rgba(255,255,255,0.12); }
    #about-socials { display: flex; gap: 20px; align-items: center; }
    #about-socials a { display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.6); transition: border-color 180ms ease, color 180ms ease; }
    #about-socials a:hover { border-color: rgba(255,255,255,0.8); color: #fff; }
    #about-socials svg { width: 16px; height: 16px; }

    /* ─── PODCAST ─── */
    #podcast-section { background: #fff; color: #1a1a1a; padding: 80px 8%; }
    .pod-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 32px; flex-wrap: wrap; gap: 12px; }
    .pod-title-label { font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase; color: rgba(0,0,0,0.35); margin-bottom: 4px; font-family: 'Fragment Mono', monospace; }
    .pod-title { font-size: clamp(44px, 7vw, 80px); font-weight: 900; letter-spacing: 0.22em; text-transform: uppercase; color: #1a1a1a; line-height: 0.88; }
    .pod-cta { font-size: 13px; font-weight: 600; color: #1a1a1a; border-bottom: 1px solid rgba(0,0,0,0.18); padding-bottom: 2px; transition: opacity 180ms ease; }
    .pod-cta:hover { opacity: 0.5; }
    .pod-divider { width: 100%; height: 1px; background: rgba(0,0,0,0.09); border: none; margin: 0; }
    .pod-grid { display: grid; grid-template-columns: 1fr 1fr; align-items: start; gap: 0; }
    .pod-left { border-right: 1px solid rgba(0,0,0,0.09); padding: 36px 40px 36px 0; }
    .pod-right { padding: 36px 0 36px 40px; display: flex; flex-direction: column; gap: 24px; }
    .pod-video-wrap { position: relative; border-radius: 3px; overflow: hidden; aspect-ratio: 16/9; background: #e8e8e8; }
    .pod-play-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.12); display: flex; align-items: center; justify-content: center; }
    .pod-play-btn { width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,0.93); display: flex; align-items: center; justify-content: center; color: #1a1a1a; box-shadow: 0 2px 20px rgba(0,0,0,0.18); transition: transform 200ms ease; cursor: pointer; }
    .pod-play-btn:hover { transform: scale(1.06); }
